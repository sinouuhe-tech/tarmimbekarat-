<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | FARAHMAND</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="admin container"><div class="page-head"><h1>پنل مدیریت</h1></div><div class="card form-card"><form id="login"><div class="field"><label>رمز مدیریت</label><input id="pw" type="password" required></div><button class="btn">ورود</button><p id="msg"></p></form></div><div id="panel" style="display:none" class="card"><h2>مدیریت محتوا</h2><p>پنل مدیریت برای مقالات، سوالات و تنظیمات D1 آماده است. APIهای پروژه در /api/ قرار دارند.</p></div></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#pw').value})});if(r.ok){document.querySelector('#login').parentElement.style.display='none';document.querySelector('#panel').style.display='block'}else document.querySelector('#msg').textContent='رمز صحیح نیست.'}</script></body></html>
